name: CI - Gasoline Microservices

on:
  push:
    branches: [ main, master ]
    paths:
      - 'services/dispatch-service/**'
      - 'services/telemetry-service/**'
      - 'services/station-service/**'
      - 'services/reconciliation-service/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'services/dispatch-service/**'
      - 'services/telemetry-service/**'
      - 'services/station-service/**'
      - 'services/reconciliation-service/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  test-dispatch-service:
    name: Test Dispatch Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dispatch-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --tb=short

  test-station-service:
    name: Test Station Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/station-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --tb=short

  test-telemetry-service:
    name: Test Telemetry Service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telemetry-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/telemetry-service/go.sum

      - name: 🧪 Run Go Tests
        run: |
          go test -v -race ./...

  test-reconciliation-service:
    name: Test Reconciliation Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reconciliation-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --tb=short

  build-hitl-dashboard:
    name: Build HITL Dashboard (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Typecheck & Build
        run: npm run build

  build-docker-images:
    name: Rebuild All Docker Images
    runs-on: ubuntu-latest
    needs:
      - test-dispatch-service
      - test-station-service
      - test-telemetry-service
      - test-reconciliation-service
      - build-hitl-dashboard

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ✅ Validate Docker Compose config
        run: docker compose config -q

      - name: 🏗️ Build All Microservice & Frontend Images
        run: docker compose build --no-cache
