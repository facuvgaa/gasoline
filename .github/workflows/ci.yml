name: CI - Gasoline Microservices

on:
  push:
    branches: [ main, master ]
    paths:
      - 'services/dispatch-service/**'
      - 'services/telemetry-service/**'
      - 'services/station-service/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'services/dispatch-service/**'
      - 'services/telemetry-service/**'
      - 'services/station-service/**'
      - '.github/workflows/ci.yml'

jobs:
  test-dispatch-service:
    name: Test Dispatch Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dispatch-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --tb=short

  test-station-service:
    name: Test Station Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/station-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --tb=short

  test-telemetry-service:
    name: Test Telemetry Service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telemetry-service

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: services/telemetry-service/go.sum

      - name: 🧪 Run Go Tests
        run: |
          go test -v -race ./...
